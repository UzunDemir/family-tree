<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <meta name="theme-color" content="#05050f">
  <title>Семейное древо Узун</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <header id="header">
    <h1>Семейное древо Узун</h1>
    <p class="subtitle">Нажми на карточку · Колесо мыши — зум · Перетаскивание — панорама</p>
  </header>

  <div id="tree-container"></div>

  <div class="tooltip" id="tooltip"></div>

  <div id="controls">
    <button id="btn-reset" title="Сбросить вид">⟲ Сброс</button>
    <button id="btn-clear-generated" title="Убрать бесконечных предков">🌫 Сброс рода</button>
    <button id="btn-zoom-in" title="Приблизить">＋</button>
    <button id="btn-zoom-out" title="Отдалить">－</button>
    <button id="btn-toggle-lines" title="Показать/скрыть линии">〰 Линии</button>
  </div>

  <footer id="footer">
    <span id="stats"></span>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
